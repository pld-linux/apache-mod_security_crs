# OWASP Core Rule Set (modsecurity-crs) for Apache mod_security.
# Order required by CRS: setup, plugin config, plugin before-rules, local before-rules,
# rules, plugin after-rules, local after-rules.
Include modsecurity-crs/crs-setup.conf
Include /usr/share/modsecurity-crs/plugins/*-config.conf
Include /usr/share/modsecurity-crs/plugins/*-before.conf
Include modsecurity-crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /usr/share/modsecurity-crs/plugins/*-after.conf
Include modsecurity-crs/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
